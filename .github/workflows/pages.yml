name: Deploy static site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gpu: [mesa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/build-level-pages.mjs
      - run: node --test tests/modal-focus.test.mjs
      - run: npm ci --prefix tools/browser-ci --ignore-scripts
      - run: node tools/browser-ci/node_modules/playwright/cli.js install --with-deps chromium
      - name: Observe original desktop cases without changing assertions or timeouts
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/diagnose-browser.cjs
          LIBGL_ALWAYS_SOFTWARE: '1'
          PROPS_GPU: ${{ matrix.gpu }}
          DEBUG: pw:browser
        run: >-
          xvfb-run -a node tools/test-browser.mjs stress --root output/site
          --scenario lifecycle
          --profile desktop --profile android-portrait --profile android-landscape
          --iterations 1 --output output/browser-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schwabingen-desktop-diagnostics-${{ matrix.gpu }}
          path: output/browser-ci
          retention-days: 7
