name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fullscreen lifecycle
        run: node --test tests/fullscreen.test.mjs
      - name: Check JWD home and neighbors
        run: node --test tests/jwd-home.test.mjs tests/character-review.test.mjs tests/building-placards.test.mjs
      - name: Check running hotkey
        run: node --test tests/running-hotkey.test.mjs tests/jobcenter.test.mjs
      - name: Check office queue call audio
        run: node --test tests/buergeramt-queue-audio.test.mjs tests/buergeramt-multiple-tickets.test.mjs tests/knick-name-announcement.test.mjs tests/knick-speech-cache.test.mjs tests/knick-browser-assets.test.mjs
      - name: Check office touch navigation, turning and direction texture reuse
        run: node --test tests/buergeramt-touch-navigation.test.mjs tests/buergeramt-touch-target.test.mjs tests/buergeramt-turning.test.mjs
      - name: Check office causality and re-entry
        run: node --test tests/buergeramt-causality.test.mjs tests/buergeramt-facing-interaction.test.mjs
      - name: Check phone lifecycle and registration rewards
        run: node --test tests/buergeramt-phone-lifecycle.test.mjs tests/kriminalpolizei-phone.test.mjs
      - name: Check president portrait interaction
        run: node --test tests/buergeramt-president-portrait.test.mjs
      - name: Check potato mirror reflection and interaction
        run: node --test tests/buergeramt-potato-mirror.test.mjs
      - name: Check law pickup and sirens
        run: node --test tests/law-pickup.test.mjs tests/police-audio.test.mjs tests/police-escalation.test.mjs
      - name: Check fixed character voices
        run: |
          node tools/curate-voice-library.mjs --check
          node --test tests/buergeramt-ambient.test.mjs
          node --test tests/voice-consistency.test.mjs tests/voice-cast.test.mjs tests/voice-candidate-preview.test.mjs tests/street-wisdom.test.mjs tests/street-wisdom-encounters.test.mjs tests/law-voice-assets.test.mjs tests/knick-generation-receipts.test.mjs
      - name: Check game and browser regressions
        run: node --test tests/preload.test.mjs tests/browser-performance.test.mjs tests/runtime-smoothness.test.mjs tests/object-physics-consistency.test.mjs tests/police-driving.test.mjs tests/vehicle-lifecycle.test.mjs tests/train-consists.test.mjs tests/ambient-traffic.test.mjs tests/browser-responsiveness.test.mjs tests/asset-streaming.test.mjs tests/tourist-animation.test.mjs tests/intro-music.test.mjs tests/splat-preview.test.mjs tests/crossing-layout.test.mjs tests/browser-benchmark.test.mjs tests/touch-controls.test.mjs tests/english-subtitles.test.mjs tests/merkel-voice.test.mjs tests/mission-fax.test.mjs tests/mission-pointer.test.mjs tests/buergeramt-door-radiance.test.mjs tests/buergeramt-entry.test.mjs
      - name: Check office oil-floor lifetime
        run: node --test tests/buergeramt-floor.test.mjs tests/buergeramt-restoration.test.mjs tests/buergeramt-goop-phone.test.mjs tests/buergeramt-portrait-melt.test.mjs tests/buergeramt-lamps.test.mjs
      - name: Check office Gaussian actions and lifetime
        run: node --test tests/buergeramt-gaussian-animation.test.mjs tests/buergeramt-gaussian-renderer.test.mjs tests/buergeramt-gaussian-scene.test.mjs tests/buergeramt-gaussian-data.test.mjs tests/buergeramt-painted-anchor.test.mjs tests/buergeramt-splat-owner.test.mjs tests/buergeramt-movement.test.mjs tests/buergeramt-animation-timing.test.mjs tests/buergeramt-session.test.mjs tests/buergeramt-registration.test.mjs tests/buergeramt-inline.test.mjs tests/buergeramt-dialogue-recordings.test.mjs tests/buergeramt-queue.test.mjs tests/buergeramt-link.test.mjs tests/buergeramt-full-cast.test.mjs tests/buergeramt-clerk-voices.test.mjs tests/buergeramt-lips.test.mjs tests/buergeramt-speech-cues.test.mjs tests/aktenkurier-lipsync.test.mjs tests/aktenkurier-official-voice.test.mjs tests/buergeramt-splat.test.mjs tests/buergeramt-fever.test.mjs tests/buergeramt-fever-voices.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
