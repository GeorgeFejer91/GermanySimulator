<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#77756f">
  <meta name="description" content="Walking-sprite atlas and focused animation preview for Germany Simulator.">
  <link rel="icon" href="./assets/faxgeraet.svg" type="image/svg+xml">
  <title>Walking Sprite Preview · Germany Simulator</title>
  <style>
    :root{
      color-scheme:light;
      font-family:"Arial Narrow","Helvetica Neue",sans-serif;
      background:#77756f;
      color:#1d1c19;
      --paper:#e9e3d5;
      --ink:#1d1c19;
      --line:#5f5b53;
      --muted:#67635b;
      --accent:#762f29;
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:300px;background:#77756f}
    button,input,select{font:inherit}
    button,select,input[type="range"]{accent-color:var(--accent)}
    header{position:sticky;z-index:2;top:0;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 18px;border-bottom:3px double var(--ink);background:var(--paper)}
    h1{margin:0;font-size:20px;line-height:1;letter-spacing:-.02em}
    h1 span{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.15em}
    .controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    .focus-control[hidden]{display:none}
    button,select{min-height:34px;padding:6px 10px;border:1px solid var(--ink);border-radius:4px;background:#f4efe4;color:var(--ink);font-weight:800}
    button:hover{background:#ded7c8}
    button[aria-pressed="true"],button[aria-pressed="true"]:hover{background:var(--ink);color:var(--paper)}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .frame-control{display:grid;grid-template-columns:auto minmax(130px,220px);align-items:center;gap:8px;min-width:min(100%,260px)}
    output{font:800 11px/1.2 ui-monospace,"SFMono-Regular",monospace;white-space:nowrap}
    main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(1180px,100%);margin:0 auto;padding:14px}
    main[hidden]{display:none}
    #focus-preview{width:min(760px,calc(100% - 28px));margin:14px auto;border:1px solid var(--line);background:var(--paper)}
    #focus-preview[hidden]{display:none}
    #focus-preview>header{position:static;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:#d8d2c5}
    #focus-preview figure{min-height:560px;padding:38px 12px 22px}
    #focus-preview canvas{width:min(500px,78vw)}
    article{min-width:0;align-self:start;border:1px solid var(--line);background:var(--paper)}
    article>header{position:static;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:#d8d2c5}
    h2{margin:0;font-size:15px}
    article>header span{color:var(--muted);font:800 9px/1 ui-monospace,"SFMono-Regular",monospace}
    .directions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
    .directions.two{grid-template-columns:1fr}
    figure{position:relative;display:grid;place-items:center;min-height:218px;margin:0;padding:26px 8px 12px;background:
      linear-gradient(45deg,#c9c7c1 25%,transparent 25%),
      linear-gradient(-45deg,#c9c7c1 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#c9c7c1 75%),
      linear-gradient(-45deg,transparent 75%,#c9c7c1 75%),#b8b6b0;
      background-position:0 0,0 8px,8px -8px,-8px 0;
      background-size:16px 16px}
    figcaption{position:absolute;top:7px;left:8px;padding:2px 5px;border:1px solid rgba(29,28,25,.5);background:rgba(233,227,213,.9);font-size:9px;font-weight:900;letter-spacing:.08em}
    canvas{display:block;width:min(180px,44vw);height:auto;aspect-ratio:1;object-fit:contain}
    .error{grid-column:1/-1;margin:20px;padding:18px;border:2px solid var(--ink);background:var(--paper);font-weight:800}
    @media(min-width:1120px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){
      header{position:static;align-items:flex-start;flex-direction:column;padding:12px}
      .controls{justify-content:flex-start;width:100%}
      .frame-control{grid-template-columns:minmax(0,1fr) 92px;order:2;flex:1 0 100%;width:100%;min-width:0}
      .frame-control output{overflow:hidden;text-align:right}
      main{grid-template-columns:1fr;padding:8px}
      #focus-preview{width:calc(100% - 16px);margin:8px auto}
      #focus-preview figure{min-height:430px}
      #focus-preview canvas{width:min(390px,88vw)}
      figure{min-height:176px}
      canvas{width:min(156px,43vw)}
    }
    @media(max-width:390px){.directions{grid-template-columns:1fr}canvas{width:180px}}
  </style>
</head>
<body>
  <header>
    <h1>SPRITE PRÜFSTELLE <span>32-FRAME WALKING ATLAS PREVIEW</span></h1>
    <div class="controls" aria-label="Animation controls">
      <button id="mode" type="button" aria-pressed="false">ANIMATION PREVIEW</button>
      <label class="focus-control" hidden>CHARACTER
        <select id="character" aria-label="Preview character"></select>
      </label>
      <label class="focus-control" hidden>DIRECTION
        <select id="direction" aria-label="Preview direction"></select>
      </label>
      <button id="toggle" type="button">PAUSE</button>
      <button id="previous" type="button" aria-label="Previous frame">−1 FRAME</button>
      <button id="next" type="button" aria-label="Next frame">+1 FRAME</button>
      <label>SPEED
        <select id="speed">
          <option value="8">8 FPS</option>
          <option value="12">12 FPS</option>
          <option value="16" selected>16 FPS</option>
          <option value="24">24 FPS</option>
        </select>
      </label>
      <label class="frame-control">
        <input id="frame" type="range" min="0" max="31" value="0" aria-label="Animation frame">
        <output id="status" for="frame">FRAME 00 / 31</output>
      </label>
    </div>
  </header>
  <section id="focus-preview" hidden aria-live="polite">
    <header>
      <h2 id="focus-title">Animation preview</h2>
      <span id="focus-meta"></span>
    </header>
    <figure>
      <figcaption id="focus-caption"></figcaption>
      <canvas id="focus-canvas" width="384" height="384" role="img"></canvas>
    </figure>
  </section>
  <main id="previews" aria-live="polite"></main>
  <script>
    const CACHE_TOKEN="20260922-biomech4";
    const DIRECTIONS=[
      ["down","FRONT · DOWN"],
      ["up","BACK · UP"],
      ["left","LEFT"],
      ["right","RIGHT"]
    ];
    const NAMES={
      merkel:"Angela Merkel",
      merz:"Friedrich Merz",
      bayern:"Bayern-Beauftragter",
      alice:"Alice Weidel",
      "towel-man":"Handtuchtourist",
      "towel-woman":"Handtuchtouristin"
    };
    const root=document.querySelector("#previews");
    const frameInput=document.querySelector("#frame");
    const status=document.querySelector("#status");
    const toggle=document.querySelector("#toggle");
    const speed=document.querySelector("#speed");
    const mode=document.querySelector("#mode");
    const focusPreview=document.querySelector("#focus-preview");
    const focusControls=[...document.querySelectorAll(".focus-control")];
    const character=document.querySelector("#character");
    const direction=document.querySelector("#direction");
    const focusTitle=document.querySelector("#focus-title");
    const focusMeta=document.querySelector("#focus-meta");
    const focusCaption=document.querySelector("#focus-caption");
    const focusCanvas=document.querySelector("#focus-canvas");
    const views=[];
    const sprites=new Map();
    let focused=false;
    let focusView=null;
    let playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;
    let phase=0;
    let shownFrame=-1;
    let lastTime=performance.now();

    function setPlaying(next){
      playing=next;
      toggle.textContent=playing?"PAUSE":"PLAY";
      toggle.setAttribute("aria-pressed",String(!playing));
      lastTime=performance.now();
    }

    function drawView(view,frame){
        if(!view?.image.complete)return;
        const size=view.canvas.width;
        const context=view.canvas.getContext("2d");
        context.clearRect(0,0,size,size);
        context.imageSmoothingEnabled=true;
        context.imageSmoothingQuality="high";
        if(view.mirror){
          context.save();
          context.translate(size,0);
          context.scale(-1,1);
        }
        context.drawImage(view.image,frame*128,view.row*128,128,128,0,0,size,size);
        if(view.mirror)context.restore();
    }

    function draw(frame){
      if(frame===shownFrame)return;
      shownFrame=frame;
      frameInput.value=String(frame);
      status.value=`FRAME ${String(frame).padStart(2,"0")} / 31`;
      for(const view of views)drawView(view,frame);
      drawView(focusView,frame);
    }

    function updateFocus(){
      const sprite=sprites.get(character.value);
      if(!sprite)return;
      const previous=direction.value;
      direction.replaceChildren(...DIRECTIONS.filter(([key])=>sprite.directions[key]).map(([key,label])=>new Option(label,key)));
      if([...direction.options].some(option=>option.value===previous))direction.value=previous;
      const reference=sprite.directions[direction.value];
      const rowName=typeof reference==="string"?reference:reference.mirror;
      focusView={canvas:focusCanvas,image:sprite.image,row:sprite.rows.indexOf(rowName),mirror:typeof reference==="object"};
      focusTitle.textContent=NAMES[sprite.id]||sprite.id;
      focusMeta.textContent=`${direction.selectedOptions[0].text} · 32 FRAMES`;
      focusCaption.textContent=direction.selectedOptions[0].text;
      focusCanvas.setAttribute("aria-label",`${focusTitle.textContent}, ${direction.selectedOptions[0].text.toLowerCase()} focused walking animation`);
      shownFrame=-1;
      draw(Math.floor(phase));
    }

    function setMode(next){
      focused=next;
      mode.textContent=focused?"ATLAS GRID":"ANIMATION PREVIEW";
      mode.setAttribute("aria-pressed",String(focused));
      root.hidden=focused;
      focusPreview.hidden=!focused;
      for(const control of focusControls)control.hidden=!focused;
      if(focused)updateFocus();
    }

    function step(amount){
      setPlaying(false);
      phase=(Math.floor(phase)+amount+32)%32;
      shownFrame=-1;
      draw(Math.floor(phase));
    }

    toggle.addEventListener("click",()=>setPlaying(!playing));
    mode.addEventListener("click",()=>setMode(!focused));
    character.addEventListener("change",updateFocus);
    direction.addEventListener("change",updateFocus);
    document.querySelector("#previous").addEventListener("click",()=>step(-1));
    document.querySelector("#next").addEventListener("click",()=>step(1));
    frameInput.addEventListener("input",()=>{
      setPlaying(false);
      phase=Number(frameInput.value);
      shownFrame=-1;
      draw(phase);
    });
    addEventListener("keydown",event=>{
      if(event.target instanceof Element&&event.target.matches("button,input,select"))return;
      if(event.code==="Space"){
        event.preventDefault();
        setPlaying(!playing);
      }else if(event.code==="ArrowLeft")step(-1);
      else if(event.code==="ArrowRight")step(1);
    });

    async function load(){
      const response=await fetch(`./assets/sprite-sources/rigs/registry.json?v=${CACHE_TOKEN}`);
      if(!response.ok)throw new Error(`Registry request failed (${response.status})`);
      const registry=await response.json();
      frameInput.max=String(registry.frameContract.runtimeFrames-1);
      for(const sprite of registry.sprites){
        const article=document.createElement("article");
        const heading=document.createElement("header");
        const title=document.createElement("h2");
        const meta=document.createElement("span");
        const directions=document.createElement("div");
        title.textContent=NAMES[sprite.id]||sprite.id;
        meta.textContent=`${sprite.rows.length} ATLAS ROWS`;
        directions.className=Object.keys(sprite.directions).length===2?"directions two":"directions";
        heading.append(title,meta);
        article.append(heading,directions);
        root.append(article);
        const image=new Image();
        image.decoding="async";
        image.src=`./${sprite.runtime}?v=${CACHE_TOKEN}`;
        image.addEventListener("load",()=>{shownFrame=-1;draw(Math.floor(phase));},{once:true});
        sprite.image=image;
        sprites.set(sprite.id,sprite);
        character.append(new Option(title.textContent,sprite.id));
        for(const [direction,label] of DIRECTIONS){
          const reference=sprite.directions[direction];
          if(!reference)continue;
          const rowName=typeof reference==="string"?reference:reference.mirror;
          const figure=document.createElement("figure");
          const caption=document.createElement("figcaption");
          const canvas=document.createElement("canvas");
          canvas.width=128;
          canvas.height=128;
          canvas.setAttribute("role","img");
          canvas.setAttribute("aria-label",`${title.textContent}, ${label.toLowerCase()} walking preview`);
          caption.textContent=label;
          figure.append(caption,canvas);
          directions.append(figure);
          views.push({canvas,image,row:sprite.rows.indexOf(rowName),mirror:typeof reference==="object"});
        }
      }
      updateFocus();
    }

    function animate(time){
      if(playing){
        phase=(phase+(time-lastTime)*Number(speed.value)/1000)%32;
      }
      lastTime=time;
      draw(Math.floor(phase));
      requestAnimationFrame(animate);
    }

    setPlaying(playing);
    setMode(false);
    load().catch(error=>{
      root.innerHTML=`<p class="error">SPRITE PREVIEW COULD NOT LOAD: ${error.message}</p>`;
      console.error(error);
    });
    requestAnimationFrame(animate);
  </script>
</body>
</html>
