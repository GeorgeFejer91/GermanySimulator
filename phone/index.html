<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4">
  <title>Bürgeramt · Telefon</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./pairing.css">
  <script type="module" src="./app.js"></script>
  <script type="module" src="../buergeramt-fit.js"></script>
</head>
<body>
  <main id="ble-pairing">
    <header><h1>Bürgeramt-Telefon</h1><button type="button" id="install-app" disabled>Download App</button></header>
    <p>Öffnen Sie im Windows-Spiel <strong>Bürgeramt → Bluetooth-Telefon koppeln</strong>.</p>
    <form id="pair-phone">
      <label for="pair-code">Kopplungscode</label>
      <input id="pair-code" required pattern="[0-9]{8}" maxlength="8" inputmode="numeric" autocomplete="off">
      <button id="connect-phone" type="submit" disabled>Über Bluetooth verbinden</button>
    </form>
    <p id="ble-status" role="status">Offline-Dateien werden geladen …</p>
  </main>
  <iframe id="amt-phone" title="Bürgeramt-Telefon" allow="fullscreen" hidden></iframe>
</body>
</html>
