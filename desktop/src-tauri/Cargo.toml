[package]
name = "germany-simulator"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
windows = { version = "0.62.2", features = ["Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Storage_Streams"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
