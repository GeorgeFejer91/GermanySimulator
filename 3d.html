<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#77756f;font-family:Arial,sans-serif}
.hud{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:rgba(232,228,216,.9);border:1px solid #222}

.dialogue.show{display:block}.dialogue b{display:block;margin-bottom:7px;letter-spacing:.09em}
.controls{position:fixed;z-index:24;left:0;right:0;bottom:0;height:106px;display:grid;grid-template-columns:70px 1fr 78px;gap:6px;padding:7px;background:rgba(225,220,208,.97);border-top:2px solid #222}
.controls button{border:1px solid #222;background:#e8e2d4;font-weight:900;font-size:17px;touch-action:none}
.controls .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.controls .act{background:#171717;color:#eee8da}
.badge{position:fixed;z-index:20;right:12px;bottom:118px;padding:7px 10px;background:rgba(232,228,216,.9);border:1px solid #333;font-size:9px}
@media(min-width:800px){.controls{width:520px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>
<main id="app">
  <div class="hud"><div><small>EXPERIMENTAL WEBGL BUILD</small><b>GERMANY SIMULATOR · 3D</b></div><div class="status"><b id="district">BERLIN</b><br>THREE.JS MESH WORLD</div></div>

  <div id="dialogue" class="dialogue"><b id="speaker"></b><span id="line"></span></div>

<script>
(()=>{"use strict";
const CITY={w:9840,h:4240},RAIL_GUTTER=560,WORLD={w:CITY.w+RAIL_GUTTER*2,h:CITY.h+RAIL_GUTTER*2},offsetWorldPoint=item=>({...item,x:item.x+RAIL_GUTTER,y:item.y+RAIL_GUTTER}),player={x:5960+RAIL_GUTTER,y:3900+RAIL_GUTTER,facing:0},keys={},police=[];
const horizontalRoads=[{x:RAIL_GUTTER,y:820+RAIL_GUTTER,w:CITY.w,h:260},{x:RAIL_GUTTER,y:2000+RAIL_GUTTER,w:CITY.w,h:240},{x:RAIL_GUTTER,y:3000+RAIL_GUTTER,w:CITY.w,h:220}];

const roads=[...horizontalRoads,...verticalRoads],crossings=[];
for(const h of horizontalRoads)for(const v of verticalRoads){crossings.push({x:v.x,y:h.y-80,w:v.w,h:80});crossings.push({x:v.x-90,y:h.y,w:90,h:h.h})}
crossings.push(...[{x:3590,y:2985,w:120,h:270},{x:6550,y:2985,w:120,h:270},{x:8200,y:2985,w:120,h:270}].map(offsetWorldPoint));
const trafficLights=[];
function addTrafficLight(crossingId,x,y,waitX,waitY,turn,phaseOffset,sign=false){trafficLights.push({id:trafficLights.length,crossingId,x,y,waitX,waitY,turn,phaseOffset,sign,green:false})}

const buildings=[
{id:"buergeramt",name:"BÜRGERAMT",x:150,y:220,w:350,h:250,hgt:115,doorX:325,doorY:500,sign:"TERMIN NUR MIT TERMIN"},
{id:"hausverwaltung",name:"HAUSVERWALTUNG",x:590,y:210,w:330,h:255,hgt:95,doorX:755,doorY:495,sign:"WOHNUNGSGEBERBESTÄTIGUNG"},
{id:"stadtbild",name:"AMT FÜR STADTBILD",x:1390,y:220,w:360,h:245,hgt:105,doorX:1570,doorY:495,sign:"OPTISCHE ORDNUNG · DIN 0815"},
{id:"auslaender",name:"AUSLÄNDERBEHÖRDE",x:1840,y:190,w:430,h:280,hgt:130,doorX:2055,doorY:505,sign:"VORSPRACHE NUR NACH VORSPRACHE"},
{id:"finanzamt",name:"FINANZAMT",x:1420,y:1260,w:360,h:265,hgt:120,doorX:1600,doorY:1555,sign:"STEUERN · NUMMERN · RÜCKFRAGEN"},
{id:"krankenkasse",name:"KRANKENKASSE",x:1900,y:1260,w:340,h:260,hgt:90,doorX:2070,doorY:1550,sign:"BITTE BLEIBEN SIE GESUND"},
{id:"polizei",name:"POLIZEI",x:2900,y:3300,w:650,h:360,hgt:185,doorX:3225,doorY:3690,sign:"ABSCHNITT 08 · GARTENAUFSICHT"},
{id:"spaeti",name:"SPÄTI",x:130,y:620,w:250,h:145,hgt:55,doorX:255,doorY:795,sign:"PFAND · MATE · ALLES"},
{id:"imbiss",name:"WURST-INSEL",x:1900,y:630,w:280,h:150,hgt:55,doorX:2040,doorY:810,sign:"BRATWURST · CURRYWURST"},
{id:"faxamt",name:"BUNDESFAXAMT",x:2700,y:250,w:620,h:380,hgt:180,doorX:3010,doorY:660,sign:"DIGITALISIERUNG DURCH PAPIER"},
{id:"tuev",name:"TÜV-ZENTRUM",x:3700,y:250,w:650,h:390,hgt:175,doorX:4025,doorY:670,sign:"BITTE BLEIBEN SIE PRÜFBAR"},
{id:"sparkasse",name:"SPARKASSE",x:2750,y:1260,w:600,h:400,hgt:165,doorX:3050,doorY:1690,sign:"BERATUNG NUR MIT TERMIN"},
{id:"post",name:"DEUTSCHE POST",x:3700,y:1260,w:650,h:400,hgt:170,doorX:4025,doorY:1690,sign:"BRIEF · FAX · WARTEMARKE"},
{id:"rathaus",name:"RATHAUS",x:2750,y:2320,w:700,h:430,hgt:205,doorX:3100,doorY:2780,sign:"BÜRGERNÄHE NACH TERMINVEREINBARUNG"},
{id:"baumarkt",name:"DIN-BAUMARKT",x:3700,y:2320,w:650,h:430,hgt:160,doorX:4025,doorY:2780,sign:"NORMGERECHTE SCHRAUBEN"},
{id:"akw",kind:"nuclear",name:"AKW · GESCHLOSSEN",x:4750,y:3370,w:850,h:420,hgt:155,doorX:5175,doorY:3820,sign:"STILLGELEGT · ZUGANG VERSIEGELT"},
{id:"kohlewerk",kind:"coal",name:"KOHLEKRAFTWERK · IN BETRIEB",x:6250,y:3370,w:850,h:420,hgt:170,doorX:6675,doorY:3820,sign:"OFFEN · 24/7 · RAUCHFANG AKTIV"},
{id:"bundestag",name:"DEUTSCHER BUNDESTAG",x:7800,y:3370,w:920,h:420,hgt:205,doorX:8260,doorY:3820,sign:"REICHSTAGSGEBÄUDE · PLENARBEREICH"}
].map(building=>({...offsetWorldPoint(building),doorX:building.doorX+RAIL_GUTTER,doorY:building.doorY+RAIL_GUTTER}));
const schreber=offsetWorldPoint({x:90,y:1210,w:560,h:570}),policeGarden=offsetWorldPoint({x:2850,y:3250,w:1500,h:650}),policePath={x1:4250+RAIL_GUTTER,y1:3850+RAIL_GUTTER,x2:3650+RAIL_GUTTER,y2:3250+RAIL_GUTTER,width:130};
const BORDER_Y=1120+RAIL_GUTTER,BORDER_BAND=72,crossingSigns=[],borderGates=roads.filter(r=>r.h===CITY.h).map(r=>({x:r.x-55,w:r.w+110})),borderSegments=[];
for(let cursor=0,i=0;i<=borderGates.length;i++){const gate=borderGates[i],end=gate?gate.x:WORLD.w;if(end-cursor>24)borderSegments.push({x:cursor,w:end-cursor});if(gate)cursor=gate.x+gate.w}
const wrap=(n,l)=>((n%l)+l)%l;
function railPoint(loop,progress){const s=wrap(progress,loop.length),arc=loop.radius*Math.PI/2,w=loop.straightW,h=loop.straightH,r=loop.radius,x0=loop.minX,y0=loop.minY,x1=loop.maxX,y1=loop.maxY,cx0=x0+r,cx1=x1-r,cy0=y0+r,cy1=y1-r;let d=s,a;if(d<w)return{x:cx0+d,y:y0,angle:0,progress:s};d-=w;if(d<arc){a=-Math.PI/2+d/r;return{x:cx1+Math.cos(a)*r,y:cy0+Math.sin(a)*r,angle:a+Math.PI/2,progress:s}}d-=arc;if(d<h)return{x:x1,y:cy0+d,angle:Math.PI/2,progress:s};d-=h;if(d<arc){a=d/r;return{x:cx1+Math.cos(a)*r,y:cy1+Math.sin(a)*r,angle:a+Math.PI/2,progress:s}}d-=arc;if(d<w)return{x:cx1-d,y:y1,angle:Math.PI,progress:s};d-=w;if(d<arc){a=Math.PI/2+d/r;return{x:cx0+Math.cos(a)*r,y:cy1+Math.sin(a)*r,angle:a+Math.PI/2,progress:s}}d-=arc;if(d<h)return{x:x0,y:cy1-d,angle:-Math.PI/2,progress:s};d-=h;a=Math.PI+d/r;return{x:cx0+Math.cos(a)*r,y:cy0+Math.sin(a)*r,angle:a+Math.PI/2,progress:s}}
function railLoop(id,inset,radius,dir){const loop={id,minX:inset,minY:inset,maxX:WORLD.w-inset,maxY:WORLD.h-inset,radius,dir};loop.straightW=loop.maxX-loop.minX-radius*2;loop.straightH=loop.maxY-loop.minY-radius*2;loop.length=2*(loop.straightW+loop.straightH)+2*Math.PI*radius;const count=Math.ceil(loop.length/55);loop.samples=Array.from({length:count},(_,i)=>railPoint(loop,loop.length*i/count));return loop}
const railLoops=[railLoop("aussenring",72,720,1),railLoop("innenring",232,560,-1)],railTracks=railLoops,carOffsets=[780,520,260,0,-260,-520,-780],TRAIN_MIN_GAP=1820,TRAIN_BOUNCE_PAUSE=.82;
function syncTrain(train){const loop=railLoops[train.loopIndex],orientation=train.orientation,p=railPoint(loop,train.progress);train.x=p.x;train.y=p.y;train.angle=p.angle+(orientation<0?Math.PI:0);train.cars.forEach((car,i)=>{const q=railPoint(loop,train.progress+orientation*carOffsets[i]);car.x=q.x;car.y=q.y;car.angle=q.angle+(orientation<0?Math.PI:0)})}
const trains=[[0,.03,1,188,94],[0,.19,-1,252,132],[0,.35,1,170,76],[0,.51,-1,226,118],[0,.67,1,278,148],[0,.83,-1,202,88],[1,.07,-1,238,105],[1,.23,1,176,84],[1,.39,-1,264,145],[1,.55,1,198,98],[1,.71,-1,286,156],[1,.87,1,214,112]].map((seed,i)=>{const loop=railLoops[seed[0]],train={id:"diagnostic-train-"+i,loopIndex:seed[0],progress:loop.length*seed[1],dir:seed[2],orientation:seed[2],baseSpeed:seed[3],speed:seed[3],acceleration:seed[4],pause:0,bouncePause:0,reversePending:false,collisionCooldown:0,motion:0,chaos:2+i*.7,bump:0,queued:false,x:0,y:0,angle:0,cars:carOffsets.map(()=>({x:0,y:0,angle:0}))};syncTrain(train);return train});
function railSeparation(from,to,length){return wrap(to-from+length/2,length)-length/2}
function updateDiagnosticTrains(dt){for(const train of trains){train.collisionCooldown=Math.max(0,train.collisionCooldown-dt);if(train.bouncePause>0){train.bouncePause=Math.max(0,train.bouncePause-dt);if(train.bouncePause===0&&train.reversePending){train.dir*=-1;train.reversePending=false;train.speed=0}}train.chaos-=dt;if(train.chaos<=0){if(Math.random()<.4)train.pause=1.8+Math.random()*4;train.chaos=3.6+Math.random()*7.4}train.pause=Math.max(0,train.pause-dt);const target=train.pause>0||train.bouncePause>0?0:train.baseSpeed,rate=target<train.speed?train.acceleration*3.2:train.acceleration;train.speed+=Math.max(-rate*dt,Math.min(rate*dt,target-train.speed));train.motion=train.dir*Math.max(0,train.speed*dt);train.queued=false}const contacts=[];for(let pass=0;pass<3;pass++)for(let i=0;i<trains.length;i++)for(let j=i+1;j<trains.length;j++){const a=trains[i],b=trains[j];if(a.loopIndex!==b.loopIndex)continue;const length=railLoops[a.loopIndex].length,distance=Math.abs(railSeparation(a.progress,b.progress,length)),nextDistance=Math.abs(railSeparation(a.progress+a.motion,b.progress+b.motion,length));if(nextDistance>=TRAIN_MIN_GAP||nextDistance>=distance)continue;const closure=distance-nextDistance,factor=closure>0?Math.max(0,Math.min(1,(distance-TRAIN_MIN_GAP)/closure)):0;a.motion*=factor;b.motion*=factor;a.queued=b.queued=true;if(!contacts.some(pair=>pair[0]===a&&pair[1]===b))contacts.push([a,b])}for(const [a,b] of contacts)if(!a.reversePending&&!b.reversePending&&a.collisionCooldown<=0&&b.collisionCooldown<=0)for(const train of [a,b]){train.speed=0;train.bouncePause=TRAIN_BOUNCE_PAUSE;train.reversePending=true;train.collisionCooldown=1.35;train.bump=1;train.queued=true}for(const train of trains){const loop=railLoops[train.loopIndex];train.progress=wrap(train.progress+train.motion,loop.length);train.bump=train.reversePending?Math.max(.45,train.bump-dt*.65):Math.max(0,train.bump-dt*3);syncTrain(train)}}
const fireSources=[];for(let x=52,i=0;x<WORLD.w;x+=104,i++)fireSources.push({x,y:BORDER_Y,active:true,intensity:.82+(i%5)*.035,seed:(i*47%101)/101});
const faxBillboardPool=[
 {src:"./assets/billboards/fax/die-neue-faxkraft.webp"},
 {src:"./assets/billboards/fax/fortschritt-per-fax.webp"}
];
const props=[
{x:2860,y:760,asset:"faxbillboard",billboard:faxBillboardPool[0],id:"fax1"},{x:3500,y:1880,asset:"faxbillboard",billboard:faxBillboardPool[1],id:"fax2"},{x:3980,y:2890,asset:"faxbillboard",billboard:faxBillboardPool[0],id:"fax3"}
].map(offsetWorldPoint);
const npcs=[
{x:520,y:720,vx:16,vy:0,min:470,max:900},{x:1470,y:670,vx:-13,vy:0,min:1360,max:1760},
{x:4620,y:3270,special:"merkel",route:[[4620,3270],[5750,3270],[6150,3270],[7200,3270],[7200,3880],[6120,3880],[5750,3880],[4620,3880]],target:1,facingX:1,facingY:0,animTime:0,spriteRow:2,spriteFrame:1,line:0}
].map(n=>({...offsetWorldPoint(n),min:n.min==null?n.min:n.min+RAIL_GUTTER,max:n.max==null?n.max:n.max+RAIL_GUTTER,route:n.route?.map(([x,y])=>[x+RAIL_GUTTER,y+RAIL_GUTTER])}));
const pickups=[{x:1980,y:870,type:"bratwurst",taken:false},{x:2110,y:880,type:"currywurst",taken:false},{x:4100,y:900,type:"brezel",taken:false},{x:3000,y:1910,type:"pfand",taken:false}].map(offsetWorldPoint);
window.Germany3DBridge={WORLD,player,roads,crossings,crossingSigns,trafficLights,buildings,schreber,policeGarden,policePath,BORDER_Y,BORDER_BAND,borderGates,borderSegments,railLoops,railTracks,trains,fireSources,props,pickups,getNPCs:()=>npcs,getPolice:()=>police};
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const MERKEL_AUDIO_LINE="Wir schaffen das.",merkelRecording=new Audio("./assets/merkel-wir-schaffen-das.mp3");merkelRecording.preload="auto";
const merkelLines=[MERKEL_AUDIO_LINE,"Wir brauchen kein Abschaltgesetz, sondern einen Ausstieg mit Augenmaß.","Ich habe eine neue Bewertung vorgenommen.","Die Risiken der Kernenergie sind nicht beherrschbar.","Wer das erkennt, muss eine neue Bewertung vornehmen.","Wir müssen uns darauf einstellen, dass wir schneller aussteigen.","Wir wollen das schaffen."];
function merkelBehind(n){return(player.x-n.x)*(n.facingX||1)+(player.y-n.y)*(n.facingY||0)<-24}
function updateMerkel(n,dt){const t=n.route[n.target],dx=t[0]-n.x,dy=t[1]-n.y,d=Math.hypot(dx,dy)||1;n.facingX=dx/d;n.facingY=dy/d;n.x+=n.facingX*38*dt;n.y+=n.facingY*38*dt;n.animTime+=dt;if(Math.abs(dx)>Math.abs(dy))n.spriteRow=dx<0?1:2;else n.spriteRow=dy<0?3:4;n.spriteFrame=1+Math.floor(n.animTime*5)%2;if(d<10)n.target=(n.target+1)%n.route.length}
function blocked(x,y){if(x<25||y<25||x>WORLD.w-25||y>WORLD.h-25)return true;return buildings.some(b=>x>b.x-16&&x<b.x+b.w+16&&y>b.y-16&&y<b.y+b.h+16)}
function say(s,l){document.getElementById("speaker").textContent=s;document.getElementById("line").textContent=l;const d=document.getElementById("dialogue");d.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>d.classList.remove("show"),4500);if(s.startsWith("ANGELA MERKEL")&&l===MERKEL_AUDIO_LINE){merkelRecording.currentTime=0;merkelRecording.play().catch(()=>{})}}
function interact(){const m=npcs.find(n=>n.special==="merkel"&&dist(player.x,player.y,n.x,n.y)<150);if(m){say("ANGELA MERKEL · SATIRE",merkelBehind(m)?"Sie stehen hinter mir.":merkelLines[m.line++%merkelLines.length]);return}const f=props.find(p=>dist(player.x,player.y,p.x,p.y)<150);if(f)say("FAX 3000 PRO","2,75× schneller beim Versand ausgedruckter Dokumente. Die Zukunft der Digitalisierung ist Papier.")}
function update(dt){let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;if(dx||dy)player.facing=Math.atan2(dx,dy);const nx=player.x+dx*190*dt,ny=player.y+dy*190*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;const signalClock=performance.now()/1000;for(const light of trafficLights)light.green=Math.floor((signalClock+light.phaseOffset)/6)%2===1;updateDiagnosticTrains(dt);npcs.forEach(n=>{if(n.special==="merkel")updateMerkel(n,dt);else{if(n.vx){n.x+=n.vx*dt;if(n.x<n.min||n.x>n.max)n.vx*=-1}if(n.vy){n.y+=n.vy*dt;if(n.y<n.min||n.y>n.max)n.vy*=-1}}});document.getElementById("coords").textContent=Math.round(player.x)+" / "+Math.round(player.y);document.getElementById("district").textContent=player.x>2400?"DEUTSCHLAND OST":"BERLIN"}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==="KeyE")interact()});addEventListener("keyup",e=>keys[e.code]=false);
document.querySelectorAll("[data-key]").forEach(b=>{const k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;if(k==="KeyE")interact()});["pointerup","pointercancel","pointerleave"].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();keys[k]=false}))});
document.getElementById("home").onclick=()=>{player.x=5960+RAIL_GUTTER;player.y=3900+RAIL_GUTTER};
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);window.Germany3D?.sync();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
