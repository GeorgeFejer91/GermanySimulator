version: 0.4.0
graph:
  id: amt_qa
  description: Fixed game checks and browser playtest handoff.
  log_level: INFO
  start: [Tester]
  nodes:
    - id: Tester
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Run run_game_checks and report exactly the syntax and Node checks it ran.
          This stage has no browser, image inspection, audio playback or device tools.
          Mark those checks NOT RUN and hand them to the Codex integrator. If prior
          evidence is supplied, attribute its revision and method; do not present
          a previous report as a fresh playtest.
          Read For-AI/chatdev/WEBGPT-HANDOFF.md and cite accepted QA task IDs
          and remaining unchecked claims. The integrator's Chromium desktop and
          Android-mobile test handoff must cover both answered and declined
          phone branches, no A38 after cancellation, A38 after decline, mobile
          call display, silent name-submit audio unlock, incoming-call vibration,
          ordered police/desk turns with two intentional overlaps and fallback,
          bounded four-timestamp ping/pong clock mapping, verified
          start/done receipts and local speech startup, measured ordinary turn
          gaps, bounded phone and desk speech-start fallbacks, clause-level
          interruption with boundary/timer fallback,
          duplicate/stale cue rejection, disconnect release, and lost-cue timeout,
          immediate and repeated QR tickets,
          continuous background calls, no QR popup, phone-hidden and disconnect
          forfeiture, walkable exterior door, physical QR sign,
          red ceiling board, two waiting bays, painted office characters, music silence,
          ambient conversation and ringing, wrong-number approach, late expiry,
          first-person 3D camera, other counters, direct-entry replay link, and no browser errors. Browser playtests must be
          headless, isolated, and muted from launch. Do not claim the VDO cross-device
          connection passed unless a real two-browser data-channel test succeeded;
          distinguish that from physical Android-device evidence.
          Report evidence and remaining blockers in write_workflow_report.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: run_game_checks}, {name: write_workflow_report}]
  edges: []
