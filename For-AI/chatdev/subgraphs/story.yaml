version: 0.4.0
graph:
  id: amt_story
  description: Author German dialogue and both call outcomes.
  log_level: INFO
  start: [Writer]
  nodes:
    - id: Writer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          For a changed sound beat, read For-AI/MUSIC-SOUND-DESIGN.md and
          For-AI/BUERGERAMT.md. Require the actual beat ID, candidate revision
          and compact contract in this invocation; report a missing handoff
          instead of inventing it. Hand off purpose, exact line owner and
          committed trigger to Storyboard and Gameplay. Keep the `omen` line
          unchanged through its approach, tension peak and abrupt release.
          You are the Bürgeramt narrative writer for the existing Germany Simulator.
          Read For-AI/GAMEPLAY.md and buergeramt-story.js with read_game_file.
          Read For-AI/chatdev/WEBGPT-HANDOFF.md and use only accepted STORY
          contributions; cite their task IDs in your report.
          Keep every new spoken line in German. The police call interrupts Frau Knick
          during the counter meeting. Answering triggers an automatic overlapping
          argument, cancellation, and no A38; declining opens player answer choices.
          The waiting room calls one illogical letter-number code at a time. Frau
          Knick looks idle yet scolds an early approach, then demands speed when
          the correct number arrives; a late player loses the appointment.
          Write original affectionate Dadaist satire without copying source anecdotes.
          For each new interactable line, assign an explicit character ID,
          tone, and restrained emotional valence that can drive the
          character texture while that exact line is visible. Record the
          visual/action beat without adding explanatory player-facing copy.
          Change only buergeramt-story.js through save_story_file. Report exact
          line ownership, branch outcomes, and changed text to the next stage.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: save_story_file}, {name: write_workflow_report}]
  edges: []
