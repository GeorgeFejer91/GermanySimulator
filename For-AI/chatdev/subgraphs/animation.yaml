version: 0.4.0
graph:
  id: amt_animation
  description: Review moving painted characters and their game event transitions.
  log_level: INFO
  start: [Animator]
  nodes:
    - id: Animator
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/MUSIC-SOUND-DESIGN.md for a sound-bearing action.
          Require its actual beat ID, candidate revision and compact contract
          in this invocation; report a missing handoff. Report action
          start/stop and interrupt/cleanup boundaries used by Gameplay and
          Soundscape. For `omen`, bind approach, arrival/line, actual
          speech/fallback completion, extended stare and gradual reverse
          depth/audio envelope to the same event. Settle motion, flatten depth
          and hold the opaque flat body until the registered painting takes
          ownership, then use a planted turn and silent slow retreat.
          Room/view recovery precedes ordinary walking and queue resumption;
          follow the phase boundaries in For-AI/BUERGERAMT.md.
          Read For-AI/SPRITE-GENERATION-PROTOCOL.md, the Bürgeramt source
          provenance and atlas build report, and the existing renderer.
          Route art production through animate-2d-characters and ImageGen.
          Require identity-locked front, rear and both side walks, planted
          paperwork actions, whole-body direction changes, distance-driven
          feet, fixed ground pivot, clean alpha and exact encoded-frame
          inspection at desktop and mobile size. Distinguish a numerical
          export check from visual acceptance. Report any failed source
          pose, frame, transition or runtime trigger and the smallest
          repair. This stage cannot overwrite image or game files.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: write_workflow_report}]
  edges: []
