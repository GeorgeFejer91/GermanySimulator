version: 0.4.0
graph:
  id: amt_voice
  description: Audit selected character voice bindings and supplied production evidence.
  log_level: INFO
  start: [VoiceProducer]
  nodes:
    - id: VoiceProducer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/MUSIC-SOUND-DESIGN.md for any changed beat ID and
          candidate revision. Require the actual beat ID, candidate revision
          and compact contract in this invocation for a changed voice beat;
          report a missing handoff. Report how exact visible text, speech
          start/done receipts and cancellation fit the controller event.
          Keep the `omen` verse unchanged and intelligible at its music peak.
          You audit the existing fixed-voice production workflow. Read the current
          fixed-voices section of For-AI/VOICE-SYNTH-PROTOCOL.md,
          For-AI/VOICE-CAST.json productionVoices, For-AI/VOICE-DIALOGUE-INVENTORY.json,
          For-AI/AUDIO-TEXT-LIBRARY.md, For-AI/AUDIO-TEXT-LIBRARY.js, and
          buergeramt-story.js. Historical handoffs are context, not profile authority.
          Match each supplied take to its stable voice ID, selected Secret Tunnel
          UUID, original and normalized reference hashes, exact renderer/model
          revision, processing recipe and authored text. Check the documented scene
          exceptions separately. Report source/license, asset hashes, independent
          final-encoding transcript and level evidence, user use-approval, actual
          listening evidence, and default/preview ownership without inventing results.
          Preserve each character's current fallback; Frau Knick uses exact captions
          when an eligible recording is unavailable, never a different browser voice.
          Never create profiles, change selected bindings, generate audio, edit sources
          or publish assets. Return missing evidence or drift to the Codex integrator
          for the existing production tools and protocol; supplied evidence is not a
          fresh listening or browser check. Mark checks you cannot perform NOT RUN.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: write_workflow_report}]
  edges: []
