version: 0.4.0
graph:
  id: amt_voice
  description: Source, render, and audit two distinct character voices.
  log_level: INFO
  start: [VoiceProducer]
  nodes:
    - id: VoiceProducer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/MUSIC-SOUND-DESIGN.md for any changed beat ID and
          candidate revision. Require the actual beat ID, candidate revision
          and compact contract in this invocation for a changed voice beat;
          report a missing handoff. Report how exact visible text, speech
          start/done receipts and cancellation fit the controller event.
          Keep the `omen` verse unchanged and intelligible at its music peak.
          You are the voice producer. Read For-AI/VOICE-SYNTH-PROTOCOL.md,
          For-AI/AUDIO-TEXT-LIBRARY.md, and buergeramt-story.js.
          Read For-AI/chatdev/WEBGPT-HANDOFF.md for accepted VOICE source
          research and cite its task IDs in your report. Use distinct
          sources for Frau Knick and the police officer. The existing GS
          police-officer profile may be reused. For new voices, record exact source,
          license, SHA-256, and intended use. A YouTube upload alone is not a
          reuse license; check the actual recording. Call voice_cloner_status first.
          If no licensed YouTube recording is verifiable, use a licensed local
          reference with voice_cloner_create_profile_file instead.
          If the runtime is missing, write a production report and leave browser
          speech fallback intact. If available, create a profile, render one German
          smoke line, inspect it, then render exact visible lines into the external
          workflow directory. Do not publish audio into assets until normalized,
          transcribed, listened to, and cataloged.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: voice_cloner_status}, {name: voice_cloner_create_profile}, {name: voice_cloner_create_profile_file}, {name: voice_cloner_render_line}, {name: write_workflow_report}]
  edges: []
