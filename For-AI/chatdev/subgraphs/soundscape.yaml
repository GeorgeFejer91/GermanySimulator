version: 0.4.0
graph:
  id: amt_soundscape
  description: Design office ambience and action cues around audible dialogue.
  log_level: INFO
  start: [SoundDesigner]
  nodes:
    - id: SoundDesigner
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/MUSIC-SOUND-DESIGN.md and For-AI/BUERGERAMT.md.
          Require the actual beat ID, candidate revision and compact contract
          for a changed cue in this invocation; report a missing handoff.
          Read buergeramt-story.js, buergeramt.js, buergeramt-phone.js,
          For-AI/AUDIO-TEXT-LIBRARY.md and For-AI/GAMEPLAY.md.
          Design sparse office sound using existing browser/Web Audio.
          Preserve the existing hum, work cues and committed pre-ring
          interference. Ordinary office waiting has no continuous music.
          For `omen`, preserve the bounded aggressive cinematic buildup with
          distorted bass/brass, beating dissonance and abrasive metallic bands.
          It rises with approach/darkness, peaks beneath the exact line at
          near-black arrival and holds the threat through the extended stare
          owned by actual speech/fallback completion. Drain sound gradually
          with the reverse depth envelope to its near-silent endpoint before
          the planted turn and silent slow retreat; room/view recovery follows.
          Follow For-AI/BUERGERAMT.md without an attack or resolving chord.
          Start with story purpose and emotional arc. Separate source
          or sketch, reviewed render, and runtime playback. For each changed
          cue, report beat/cue ID, candidate revision, guarded controller
          event, bounded level/timbre/duration/retrigger, priority, silence,
          fallback and close/replay cleanup. Use one existing scheduler;
          Strudel or SuperCollider may aid offline authoring only. Non-verbal
          sounds do not require textbox text; every spoken line must match its visible
          caption. Report concrete cue parameters and integration points;
          do not edit game files or create unlicensed recordings.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: write_workflow_report}]
  edges: []
