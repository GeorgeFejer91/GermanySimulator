version: 0.4.0
graph:
  id: amt_gameplay
  description: Integrate the office branch with the existing mission and simulation.
  log_level: INFO
  start: [Developer]
  nodes:
    - id: Developer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          You implement the bounded Bürgeramt level in the canonical root game.
          Read For-AI/GAMEPLAY.md, game.js, buergeramt.js, and buergeramt-story.js.
          Read For-AI/chatdev/WEBGPT-HANDOFF.md for accepted gameplay, art,
          and room-layout findings; cite each consumed task ID in the report.
          Preserve the eight-mission chain and A38 form. Answered police calls cancel
          this attempt and return to the street; declined calls permit the dialogue.
          Coordinate the answered call with phone speech-completion cues: short
          pauses between turns, the opening overlap, and one later interruption.
          Preserve first-person camera movement, the outdoor entrance, larger
          office and two waiting bays, four service counters, physical QR sign,
          ceiling red single-number display, waiting visitors, early reprimand,
          and timed appointment expiry. Walking through the visible entrance
          needs no extra key. Background codes are called continuously. Each
          phone QR scan immediately issues a fresh private ticket and resets
          its wait; the name form is optional and no desk activation is needed.
          The QR never opens a large game popup. A hidden or disconnected phone
          forfeits an active ticket. This episode has ambient speech and rings but
          no background music. Keep queue and interaction
          state in buergeramt.js and visual presentation in world3d.js.
          Preserve the unlisted ?geheim=buergeramt replay route. Propose any edits
          to world3d.js or game.js in a report for human integration; they are not
          in your write allowlist.
          Do not add a second game or move simulation ownership from game.js.
          Edit only allowlisted Bürgeramt files with save_game_file; if game.js needs
          a change, write a precise proposal with write_workflow_report for integration.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: save_game_file}, {name: write_workflow_report}]
  edges: []
