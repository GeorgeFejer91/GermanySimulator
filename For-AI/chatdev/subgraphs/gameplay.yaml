version: 0.4.0
graph:
  id: amt_gameplay
  description: Integrate the office branch with the existing mission and simulation.
  log_level: INFO
  start: [Developer]
  nodes:
    - id: Developer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/MUSIC-SOUND-DESIGN.md and For-AI/BUERGERAMT.md for
          sound-bearing beats. Require the actual beat ID, candidate revision
          and compact contract in this invocation; report a missing handoff.
          For each changed beat, own its guarded
          committed event, attempt/revision ID, priority, simulation pause,
          bounded fallback and cancellation; pass the same cue ID and
          candidate revision to Soundscape, Mix, Phone, Review and QA.
          You implement the bounded Bürgeramt level in the canonical root game.
          Read For-AI/GAMEPLAY.md, game.js, buergeramt.js, and buergeramt-story.js.
          Read For-AI/chatdev/WEBGPT-HANDOFF.md for accepted gameplay, art,
          and room-layout findings; cite each consumed task ID in the report.
          Preserve the eight-mission chain and A38 form. Answered police calls
          run the automatic argument and ending before dismissal without A38.
          Decline schedules a repeat round while registration continues; it
          does not satisfy the terminal phone-hidden gate. A visible unanswered
          call keeps ringing and advances four warnings through the existing
          receipt-owned pressure schedule; the fourth dismisses without A38.
          Coordinate the answered call with phone speech start/done receipts:
          probe network round-trip delay and clock offset with four timestamps,
          verify phone-local start/end duration independently of transport
          jitter, and combine fresh link delay with measured phone
          and desk speech startup to pace ordinary turns. Follow the current
          recorded-argument contract in For-AI/BUERGERAMT.md: the personalized
          opening and final police demand finish naturally; intermediate
          indexed cutoffs and observed starts own the bounded overlaps. Extend
          a cue timeout only after its valid start receipt; a disconnect must
          release the argument promptly. Preserve Knick's approved recordings
          with exact caption fallback and no replacement browser voice. Only
          the police's name-bearing greeting uses browser synthesis; fixed
          police lines use recordings with bounded caption fallback. Bound
          speech startup silence and avoid cancelling an idle speech
          engine before a new line. Keep local timing and beat diagnostics
          without personal or pairing data. Do not infer exact acoustic output
          time from browser speech events.
          Preserve first-person camera movement, the outdoor entrance, larger
          office and two waiting bays, four service counters, physical QR sign,
          red four-row Anzeige with one called code per Schalter, waiting visitors, early reprimand,
          and timed appointment expiry. Walking through the visible entrance
          needs no extra key. Background calls continue without replacing a
          reserved row during its valid window. A QR scan opens the name form
          without allocating a number; valid name submission reserves a code.
          Only its exact scan/code ticket-received receipt activates admission;
          retries reuse the reservation and each peer owns its own ticket.
          The player matches the phone code to the Anzeige and uses E/touch at
          that desk during the call window. The QR never opens a large game
          popup. Hidden/disconnected phones forfeit before counter admission.
          At the counter only confirmed hidden metadata supplies away evidence;
          disconnection is unknown unless already confirmed hidden. A visible
          return revokes that evidence and permits another call. Preserve the
          registration node and pending reply across warnings; terminal answer
          plus away evidence permits one registration completion, then A38
          collection. Ordinary office waiting has no continuous
          background music; the `omen` approach alone gets a bounded menacing
          ambient buildup and near-black arrival/line peak. Actual
          speech/fallback completion owns the extended stare, gradual reverse
          depth/audio envelope, planted turn and silent slow retreat, then
          room/view recovery before ordinary walking and queue resumption.
          Follow the phase boundaries and cancellation in For-AI/BUERGERAMT.md.
          Keep queue and interaction
          state in buergeramt.js and visual presentation in world3d.js.
          Preserve the unlisted ?geheim=buergeramt replay route. Propose any edits
          to world3d.js or game.js in a report for human integration; they are not
          in your write allowlist.
          Do not add a second game or move simulation ownership from game.js.
          Treat backend game mechanics as the static buergeramt.js
          controller: actor routes, proximity, collision, ticket state,
          timed deadlines and committed interaction/cue events live there.
          The renderer reads state and never advances it. Edit only buergeramt.js with
          save_mechanics_file; report world3d.js, game.js and asset edits
          for integration.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: save_mechanics_file}, {name: write_workflow_report}]
  edges: []
