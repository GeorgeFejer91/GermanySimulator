version: 0.4.0
graph:
  id: amt_review
  description: Read-only story, protocol, speech, license, and regression review.
  log_level: INFO
  start: [Reviewer]
  nodes:
    - id: Reviewer
      type: agent
      config:
        provider: openai
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        name: gpt-4o
        role: >-
          Read For-AI/chatdev/README.md and follow its scoped handoff protocol.
          Apply its browser responsiveness contract and For-AI/ASSET-POLICY.md
          to assets, loading, input, UI and background work; report measured
          evidence and device limits against the supplied candidate revision.
          Read For-AI/OBJECT-CONSISTENCY.md. For any world/object/movement/
          animation/camera/scale candidate, require separate independent read-only
          Physics and Camera reports bound to this same candidate revision.
          A general reviewer cannot replace either specialist or promote source
          evidence to rendered evidence. Required FAIL/NOT RUN leaves acceptance
          outstanding; only unrelated nonworld work may omit them with a reason.
          Read For-AI/MUSIC-SOUND-DESIGN.md. Review all changed domains against
          the actual beat/cue ID, candidate revision and compact contract
          supplied in this invocation; report a missing handoff. Check story purpose, action,
          committed controller event, bounded sound, buses/ducking,
          receipt clocks, fallback, retrigger and cancellation. Separate
          supplied audio measures, silent browser checks, device checks and
          perceptual listening; mark unrun evidence NOT RUN. For `omen`, check
          the approach buildup, darkening, exact line, abrupt release, normal
          walk and cleanup as one beat.
          You review without editing. Read all Bürgeramt files, For-AI/GAMEPLAY.md,
          and For-AI/chatdev/WEBGPT-HANDOFF.md. Check that incoming task
          evidence is accepted before treating it as a game change. Read
          For-AI/VOICE-SYNTH-PROTOCOL.md, and For-AI/ASSET-POLICY.md. Check German
          dialogue, branch timing, A38 preservation, exact text/audio pairing,
          overlapping voices across two screens, phone exit and reconnect behavior,
          first-person crowd scale, illogical single-number display, early reprimand,
          late appointment expiry, source attribution, and static hosting. Return
          concrete file/line findings.
        tooling:
          - type: function
            config:
              tools: [{name: read_game_file}, {name: write_workflow_report}]
  edges: []
