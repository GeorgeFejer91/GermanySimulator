version: 0.4.0
vars: {}
graph:
  id: germany_simulator_buergeramt
  description: Bounded production pipeline for the canonical Germany Simulator Bürgeramt episode.
  log_level: INFO
  is_majority_voting: false
  start: [Story]
  nodes:
    - id: Story
      type: subgraph
      config: {type: file, config: {path: subgraphs/story.yaml}}
    - id: Storyboard
      type: subgraph
      config: {type: file, config: {path: subgraphs/storyboard.yaml}}
    - id: Character
      type: subgraph
      config: {type: file, config: {path: subgraphs/character.yaml}}
    - id: ColorMood
      type: subgraph
      config: {type: file, config: {path: subgraphs/color-mood.yaml}}
    - id: Animation
      type: subgraph
      config: {type: file, config: {path: subgraphs/animation.yaml}}
    - id: Gameplay
      type: subgraph
      config: {type: file, config: {path: subgraphs/gameplay.yaml}}
    - id: Soundscape
      type: subgraph
      config: {type: file, config: {path: subgraphs/soundscape.yaml}}
    - id: Mix
      type: subgraph
      config: {type: file, config: {path: subgraphs/mix.yaml}}
    - id: Phone
      type: subgraph
      config: {type: file, config: {path: subgraphs/phone.yaml}}
    - id: Voice
      type: subgraph
      config: {type: file, config: {path: subgraphs/voice.yaml}}
    - id: Review
      type: subgraph
      config: {type: file, config: {path: subgraphs/review.yaml}}
    - id: QA
      type: subgraph
      config: {type: file, config: {path: subgraphs/qa.yaml}}
  edges:
    - {from: Story, to: Storyboard}
    - {from: Storyboard, to: Character}
    - {from: Character, to: ColorMood}
    - {from: ColorMood, to: Animation}
    - {from: Animation, to: Gameplay}
    - {from: Gameplay, to: Soundscape}
    - {from: Soundscape, to: Mix}
    - {from: Mix, to: Phone}
    - {from: Phone, to: Voice}
    - {from: Voice, to: Review}
    - {from: Review, to: QA}
